<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pal' Monte - Iniciar Sesión</title>
  <link rel="stylesheet" href="iniciarSesionEstilos.css">
</head>
<body>

  <div class="navbar">
    <div class="container nav-container">
      <a href="../main/palmonte.html" class="logo">🚴‍♂️ Pal' Monte</a>
      <div class="nav-links">
        <a href="../rutas/rutas.html">Rutas</a>
        <a href="../comercio/comercio.html">Comercios</a>
        <a href="../eventos/eventos.html">Eventos</a>
        <button class="btn" onclick="location.href='iniciarSesion.html'">Iniciar sesión</button>
        <button class="btn btn-verde" onclick="location.href='registro.html'">Registrarme</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>Iniciar Sesión</h1>
          <p>Ingresa tus datos para acceder a tu cuenta</p>
        </div>

        <form id="formLogin">
          <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
          </div>

          <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
          </div>

          <div id="errorMensaje" class="error-mensaje"></div>

          <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
          <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <p>© 2026 Pal' Monte - Conectando ciclistas en Ibagué</p>
      <p><a href="../rutas/rutas.html">Rutas</a> | <a href="../comercio/comercio.html">Comercios</a> | <a href="../eventos/eventos.html">Eventos</a></p>
    </div>
  </div>

  <script src="iniciarSesion.js"></script>
</body>
</html>
