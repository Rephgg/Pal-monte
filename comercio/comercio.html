<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pal' Monte - Comercios Aliados</title>
  <link rel="stylesheet" href="comercioEstilosn.css">
</head>
<body>

  <!-- Barra de navegación -->
  <div class="navbar">

      <a href="../main/palmonte.html" class="logo">🚴‍♂️ Pal' Monte</a>
      <div class="nav-links" id="navLinks">
        <!-- El contenido se llena con JS -->
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="main">
    <div class="container">

      <div class="page-header">

        <p>Descubre los mejores puntos de encuentro, talleres especializados y refugios para ciclistas.</p>

        <button class="tab active" data-categoria="todos">Todos</button>

      <!-- Grid de tarjetas -->

  <!-- Pie de página -->
  <div class="footer">
    <div class="container">
      <p>© 2026 Pal' Monte - Conectando ciclistas en Ibagué</p>
      <p>
        <a href="../rutas/rutas.html">Rutas</a> |
