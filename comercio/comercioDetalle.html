<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pal' Monte - Detalle de Comercio</title>
  <link rel="stylesheet" href="comercioDetalleEstilos.css">
</head>
<body>

  <div class="navbar">
    <div class="container nav-container">
      <a href="../main/palmonte.html" class="logo">🚴‍♂️ Pal' Monte</a>
      <div class="nav-links" id="navLinks">
        <!-- El contenido se llena con JS -->
      </div>
    </div>
  </div>

  <div class="hero" id="hero">
    <h1 id="comercioNombre">Cargando...</h1>
    <p id="comercioRating"></p>
  </div>

  <div class="container">
    <div class="grid">
      <div class="col">
        <h2>Información</h2>
        <div class="info-item" id="direccion">📍 Cargando...</div>
        <div class="info-item" id="telefono">📞 Cargando...</div>
        <div class="info-item" id="horario">🕐 Cargando...</div>
        <div class="info-item" id="sitioWeb">🌐 Cargando...</div>
        <div class="btn-group" id="btnGroup">
          <button class="btn-gris" id="btnLlamar">📞 Llamar</button>
          <button class="btn-teal" id="btnMapa">🗺️ Ver mapa</button>
        </div>
      </div>
      <div class="col">
        <h2>Ubicación</h2>
        <img class="mapa-img" id="mapaImg" src="" alt="Mapa">
        <button class="btn-gris" style="width:100%" id="btnEscribirReseña">✏️ Escribir reseña</button>
      </div>
    </div>

    <h2>Reseñas de ciclistas</h2>
    <div class="reseñas" id="reseñasContainer">
      <!-- Las reseñas se llenan con JS -->
    </div>
  </div>

  <!-- Modal para escribir reseña -->
<div id="modalResena" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ Escribir reseña</h3>
            <span id="cerrarModal" class="cerrar">&times;</span>
        </div>
        <div class="modal-body">
            <label>Calificación:</label>
            <select id="resenaCalificacion" class="modal-select">
                <option value="5">⭐⭐⭐⭐⭐ - Excelente</option>
                <option value="4">⭐⭐⭐⭐ - Muy bueno</option>
                <option value="3">⭐⭐⭐ - Bueno</option>
                <option value="2">⭐⭐ - Regular</option>
                <option value="1">⭐ - Malo</option>
            </select>
            
            <label>Comentario:</label>
            <textarea id="resenaComentario" class="modal-textarea" rows="4" placeholder="Cuéntanos tu experiencia..."></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-cancelar-modal" id="btnCancelarModal">Cancelar</button>
            <button class="btn-enviar-modal" id="btnEnviarResena">Publicar reseña</button>
        </div>
    </div>
</div>

  <div class="footer">
    <div class="container">
      <p>© 2026 Pal' Monte - Conectando ciclistas en Ibagué</p>
      <p><a href="../rutas/rutas.html">Rutas</a> | <a href="../comercio/comercio.html" class="active">Comercios</a> | <a href="../eventos/eventos.html">Eventos</a></p>
    </div>
  </div>

  <script src="comercioDetalle.js"></script>
</body>
</html>
