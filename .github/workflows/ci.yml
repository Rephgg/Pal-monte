name: CI - Pal' Monte

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_DATABASE: palmonte

jobs:
  backend:
    name: Backend (FastAPI) - Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: palmonte
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./Backend-Js
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-testing.txt

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent && break
            sleep 2
          done

      - name: Run Linting (flake8 + bandit)
        working-directory: ./Backend-Js
        run: |
          flake8 . --max-line-length=100 --max-complexity=10 --exit-zero
          bandit -r . -ll --exit-zero

      - name: Run Tests with Coverage
        working-directory: ./Backend-Js
        run: |
          pytest ../tests -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./Backend-Js/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend Web - Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install linting tools
        run: |
          npm install -g htmlhint eslint

      - name: Lint HTML
        run: |
          htmlhint main/*.html rutas/*.html eventos/*.html comercio/*.html sesion/*.html || true

      - name: Lint JavaScript
        run: |
          eslint main/*.js rutas/*.js eventos/*.js comercio/*.js sesion/*.js || true

  # mobile-build:
  #   name: Mobile Android - Build Debug
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with: { distribution: 'temurin', java-version: '17' }
  #     - uses: android-actions/setup-android@v3
  #     - name: Build Debug APK
  #       working-directory: D:/Android/AppPedalea
  #       run: ./gradlew :app:assembleDebug
  #     - name: Upload APK
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: app-debug-apk
  #         path: D:/Android/AppPedalea/app/build/outputs/apk/debug/app-debug.apk

  quality-gate:
    name: Quality Gate Summary
    needs: [backend, frontend-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend-lint: ${{ needs.frontend-lint.result }}"
          if [[ "${{ needs.backend.result }}" != "success" ]] || [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
            echo "::error::Quality Gate FAILED - One or more checks failed"
            exit 1
          fi
          echo "✅ Quality Gate PASSED"